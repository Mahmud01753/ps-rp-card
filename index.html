<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Political Science Forum Editor</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="panel"><h1>Card Editor</h1><p class="note">Design 2 is the fixed card artwork. POLITICAL SCIENCE FORUM is fixed and cannot be edited.</p><h2>Editable Text</h2><label>M.C COLLEGE, SYLHET<input id="collegeInput" value="M.C COLLEGE, SYLHET"></label><label>COMMITTEE<input id="committeeInput" value="COMMITTEE 2026-27"></label><label>Name<input id="nameInput" value="MAHMUDUL HASAN"></label><label>Role<input id="roleInput" value="MEMBER"></label><label>Batch<input id="batchInput" value="MASTER'S FINAL (47TH BATCH)"></label><label>Department<input id="departmentInput" value="DEPARTMENT OF POLITICAL SCIENCE"></label><h2>Portrait</h2><input id="photoUpload" type="file" accept="image/*"><div class="button-grid"><button data-photo="zoomIn">Zoom In</button><button data-photo="zoomOut">Zoom Out</button><button data-photo="left">Move Left</button><button data-photo="right">Move Right</button><button data-photo="up">Move Up</button><button data-photo="down">Move Down</button><button class="wide" data-photo="reset">Reset</button></div><h2>Logos</h2><label>Left logo<input id="leftLogoUpload" type="file" accept="image/*"></label><label>Right logo<input id="rightLogoUpload" type="file" accept="image/*"></label><p class="mini">Uploaded logos are converted to transparent edge-background PNGs so white/black backgrounds do not float over the card.</p><button id="downloadBtn" class="primary">DOWNLOAD PNG</button><button id="fallbackBtn" class="secondary hidden">OPEN PNG / SAVE PNG</button></aside><main class="workspace"><div id="poster" class="poster"><div class="patch college-patch"></div><div class="patch committee-patch"></div><div class="patch name-patch"></div><div class="patch role-patch"></div><div class="patch batch-patch"></div><div class="patch dept-patch"></div><div class="patch left-logo-patch"></div><div class="patch right-logo-patch"></div><div class="photo-window"><img id="portrait" src="portrait.png" alt=""></div><img id="leftLogo" class="logo left-logo" src="logo-left.png" alt=""><img id="rightLogo" class="logo right-logo" src="logo-right.png" alt=""><div id="collegeText" class="editable college-text"></div><div id="committeeText" class="editable committee-text"></div><div id="nameText" class="editable name-text"></div><div id="roleText" class="editable role-text"></div><div id="batchText" class="editable batch-text"></div><div id="departmentText" class="editable department-text"></div></div></main></div><script src="script.js"></script></body></html>
